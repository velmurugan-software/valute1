<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TempVault - Auto Expiry Storage</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Prism.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-6">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-4 border-b border-slate-800">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">TempVault</h1>
        <p class="text-slate-400 text-sm">Temporary storage for text, images, and files with auto-expiration</p>
      </div>
      <div class="flex gap-2">
        <button onclick="clearExpiredItems()" class="px-3 py-1.5 text-xs bg-red-900/40 hover:bg-red-800/60 text-red-300 rounded border border-red-700/50 transition">
          🧹 Clear Expired
        </button>
      </div>
    </header>

    <!-- Controls & Search -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <input type="text" id="searchInput" oninput="renderVault()" placeholder="Search active items..." class="md:col-span-2 px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-500">
      <button onclick="openModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg text-sm transition">
        + Add Temporary Item
      </button>
    </div>

    <!-- Active Vault Items -->
    <main id="vaultGrid" class="grid grid-cols-1 gap-4"></main>
  </div>

  <!-- Modal Interface -->
  <div id="vaultModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <h2 class="text-lg font-bold text-white">Add Temporary Entry</h2>
      
      <div class="space-y-3">
        <input type="text" id="modalTitle" placeholder="Title (e.g., Quick Note or Meeting Document)" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-indigo-500">
        
        <div class="grid grid-cols-2 gap-3">
          <select id="modalType" onchange="handleTypeChange()" class="px-3 py-2 bg-slate-900 border border-slate-700 rounded text-sm text-slate-300 focus:outline-none">
            <option value="code">Code / Text Content</option>
            <option value="image">Image Attachment</option>
            <option value="file">Document File</option>
          </select>

          <select id="modalLang" class="px-3 py-2 bg-slate-900 border border-slate-700 rounded text-sm text-slate-300 focus:outline-none">
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="sql">SQL</option>
            <option value="markdown">Markdown</option>
          </select>
        </div>

        <!-- Expiration Timer Inputs -->
        <div class="p-3 bg-slate-900/80 rounded-lg border border-slate-700 space-y-2">
          <label class="block text-xs font-semibold text-indigo-400 uppercase tracking-wider">Set Auto-Expiration Duration</label>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Hours:</label>
              <input type="number" id="expiryHours" min="0" value="1" class="w-full px-3 py-1.5 bg-slate-800 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Minutes:</label>
              <input type="number" id="expiryMinutes" min="0" max="59" value="0" class="w-full px-3 py-1.5 bg-slate-800 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
          </div>
        </div>

        <input type="text" id="modalTags" placeholder="Tags (comma separated, e.g., temp, draft, meeting)" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded text-sm text-white focus:outline-none focus:border-indigo-500">

        <!-- Code/Notes Field -->
        <div id="codeFieldContainer">
          <textarea id="modalCode" rows="6" placeholder="Paste text content or snippet here..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded text-sm font-mono text-slate-200 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <!-- File / Image Upload Field -->
        <div id="fileUploadContainer" class="hidden space-y-2">
          <label class="block text-xs text-slate-400">Select File or Image from Computer:</label>
          <input type="file" id="modalFileInput" class="w-full text-xs text-slate-300 border border-slate-700 bg-slate-900 rounded p-2 focus:outline-none">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal()" class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancel</button>
        <button onclick="saveItem()" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-500 text-white rounded font-medium">Save Item</button>
      </div>
    </div>
  </div>

  <script>
    let vaultItems = JSON.parse(localStorage.getItem('temp_vault_items') || '[]');

    function saveToStorage() {
      localStorage.setItem('temp_vault_items', JSON.stringify(vaultItems));
      renderVault();
    }

    function handleTypeChange() {
      const type = document.getElementById('modalType').value;
      const codeContainer = document.getElementById('codeFieldContainer');
      const fileContainer = document.getElementById('fileUploadContainer');
      const langSelect = document.getElementById('modalLang');

      if (type === 'code') {
        codeContainer.classList.remove('hidden');
        fileContainer.classList.add('hidden');
        langSelect.disabled = false;
      } else {
        codeContainer.classList.add('hidden');
        fileContainer.classList.remove('hidden');
        langSelect.disabled = true;
      }
    }

    function openModal() {
      document.getElementById('modalTitle').value = '';
      document.getElementById('modalTags').value = '';
      document.getElementById('modalCode').value = '';
      document.getElementById('modalFileInput').value = '';
      document.getElementById('expiryHours').value = '1';
      document.getElementById('expiryMinutes').value = '0';
      document.getElementById('modalType').value = 'code';
      handleTypeChange();
      document.getElementById('vaultModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('vaultModal').classList.add('hidden');
    }

    async function saveItem() {
      const title = document.getElementById('modalTitle').value.trim();
      const type = document.getElementById('modalType').value;
      const language = document.getElementById('modalLang').value;
      const rawTags = document.getElementById('modalTags').value;
      const code = document.getElementById('modalCode').value;
      const fileInput = document.getElementById('modalFileInput');

      const hrs = parseInt(document.getElementById('expiryHours').value) || 0;
      const mins = parseInt(document.getElementById('expiryMinutes').value) || 0;

      if (!title) return alert('Title is required.');
      if (hrs === 0 && mins === 0) return alert('Please set an expiration time greater than 0 minutes.');

      const durationMs = ((hrs * 60) + mins) * 60 * 1000;
      const expiresAt = Date.now() + durationMs;

      const tags = rawTags.split(',').map(t => t.trim().toLowerCase()).filter(Boolean);
      let fileData = null;
      let fileName = null;

      if (type !== 'code') {
        if (fileInput.files.length === 0) return alert('Please select a file or image.');
        const file = fileInput.files[0];
        fileName = file.name;
        fileData = await convertFileToBase64(file);
      }

      vaultItems.unshift({
        id: Date.now(),
        title,
        type,
        language,
        tags,
        code,
        fileData,
        fileName,
        expiresAt
      });

      saveToStorage();
      closeModal();
    }

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    function deleteItem(id) {
      vaultItems = vaultItems.filter(i => i.id !== id);
      saveToStorage();
    }

    function clearExpiredItems() {
      const now = Date.now();
      vaultItems = vaultItems.filter(item => item.expiresAt > now);
      saveToStorage();
    }

    function getRemainingTimeFormatted(expiresAt) {
      const diff = expiresAt - Date.now();
      if (diff <= 0) return "Expired";

      const totalSeconds = Math.floor(diff / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return `${hours}h ${minutes}m ${seconds}s`;
    }

    function renderVault() {
      const now = Date.now();
      // Auto-remove expired items from state
      vaultItems = vaultItems.filter(item => item.expiresAt > now);
      localStorage.setItem('temp_vault_items', JSON.stringify(vaultItems));

      const query = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('vaultGrid');

      const filtered = vaultItems.filter(item => {
        return item.title.toLowerCase().includes(query) || 
               (item.code && item.code.toLowerCase().includes(query)) ||
               (item.fileName && item.fileName.toLowerCase().includes(query)) ||
               item.tags.some(t => t.toLowerCase().includes(query));
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">No active temporary items. Add one or check expired status.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <article class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-4 space-y-3">
          <div class="flex justify-between items-center">
            <h3 class="font-semibold text-slate-100 text-base">${escapeHTML(item.title)}</h3>
            <div class="flex items-center gap-2">
              <span class="text-xs uppercase tracking-wider px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono font-semibold">
                ⏳ <span data-expiry="${item.expiresAt}" class="countdown-timer">${getRemainingTimeFormatted(item.expiresAt)}</span>
              </span>
              <span class="text-xs uppercase tracking-wider px-2 py-0.5 rounded bg-slate-700 text-slate-300 font-mono">${item.type}</span>
              <button onclick="deleteItem(${item.id})" class="text-slate-500 hover:text-red-400 text-xs px-1">✕</button>
            </div>
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${item.tags.map(t => `<span class="text-xs text-indigo-400">#${escapeHTML(t)}</span>`).join(' ')}
          </div>
          ${renderContent(item)}
        </article>
      `).join('');

      if (window.Prism) Prism.highlightAll();
    }

    function renderContent(item) {
      if (item.type === 'code') {
        return `<pre class="rounded-lg !bg-slate-950 !p-3 text-xs font-mono overflow-x-auto"><code class="language-${item.language}">${escapeHTML(item.code)}</code></pre>`;
      } else if (item.type === 'image') {
        return `
          <div class="space-y-2">
            <img src="${item.fileData}" alt="${escapeHTML(item.title)}" class="max-h-64 rounded border border-slate-700 object-contain bg-slate-950 p-1">
            <a href="${item.fileData}" download="${escapeHTML(item.fileName)}" class="inline-block text-xs text-indigo-400 hover:underline">📥 Download Image (${escapeHTML(item.fileName)})</a>
          </div>
        `;
      } else if (item.type === 'file') {
        return `
          <div class="bg-slate-900 border border-slate-700 p-3 rounded flex justify-between items-center text-xs">
            <span class="font-mono text-slate-300">📄 ${escapeHTML(item.fileName)}</span>
            <a href="${item.fileData}" download="${escapeHTML(item.fileName)}" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded font-medium">Download File</a>
          </div>
        `;
      }
    }

    function escapeHTML(str) {
      return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt me;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // Live Countdown Timer (Runs every second)
    setInterval(() => {
      let expiredFound = false;
      document.querySelectorAll('.countdown-timer').forEach(el => {
        const expiry = parseInt(el.getAttribute('data-expiry'));
        const remaining = expiry - Date.now();
        if (remaining <= 0) {
          expiredFound = true;
        } else {
          el.innerText = getRemainingTimeFormatted(expiry);
        }
      });
      if (expiredFound) {
        renderVault();
      }
    }, 1000);

    renderVault();
  </script>
</body>
</html>
